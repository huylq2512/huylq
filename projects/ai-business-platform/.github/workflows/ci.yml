name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ai_business
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d ai_business"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://app:ci-password@127.0.0.1:5432/ai_business
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # The integration tests build their own <db>_test database, but a few of them
      # (readiness, pgvector) use the main database, so migrate it first.
      - run: alembic upgrade head

      - run: pytest -q
